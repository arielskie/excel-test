<!DOCTYPE html>
<html>
<head>
    <title>Company Data Input</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; max-width: 400px; }
        input, select { width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
        button { background-color: #0078d4; color: white; padding: 10px; border: none; cursor: pointer; width: 100%; }
        table { border-collapse: collapse; width: 100%; max-width: 600px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Add New Entry</h2>
    <form id="dataForm">
        <label>ID:</label>
        <input type="number" id="inputId" required placeholder="e.g. 101">

        <label>Tester:</label>
        <input type="text" id="inputTester" required placeholder="e.g. 01STSGP">

        <label>Problem:</label>
        <input type="text" id="inputProblem" required placeholder="e.g. Network Error">

        <label>Status:</label>
        <select id="inputStatus">
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Add Row to Table</button>
    </form>

    <h2>Live Table Data</h2>
    <table id="dataTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tester</th>
                <th>Problem</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>101</td><td>01STSGP</td><td>Sample Problem</td><td>Active</td></tr>
        </tbody>
    </table>

    <script>
        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('inputId').value;
            const tester = document.getElementById('inputTester').value;
            const problem = document.getElementById('inputProblem').value;
            const status = document.getElementById('inputStatus').value;

            const table = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            newRow.innerHTML = `<td>${id}</td><td>${tester}</td><td>${problem}</td><td>${status}</td>`;

            document.getElementById('dataForm').reset();
        });
    </script>
</body>
</html>
